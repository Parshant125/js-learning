<!DOCTYPE html>
<html>

<body>
    <script>
        let travelVehicle ='Bike'  ;           //  I am  assigning any value to it
        if (travelVehicle) 
            travelVehicle = "Bike";   // this will show in alert box
         else 
            travelVehicle = "Cycle";
        alert(travelVehicle);
    </script>
</body>

</html>
